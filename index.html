   <style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0d1220; --bg2:#141b2b; --card:#1a2334; --card2:#202b40;
  --text:#e9eefb; --muted:#8b9ab5; --border:#2a3550;
  --primary:#4f8cff; --primary-d:#2f6ee0;
  --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  --purple:#a855f7; --cyan:#06b6d4; --pink:#ec4899;
  --radius:14px; --shadow:0 8px 28px rgba(0,0,0,.38);
  --sidebar:250px;
}
html[data-theme="light"]{
  --bg:#eef2f9; --bg2:#ffffff; --card:#ffffff; --card2:#f2f6fc;
  --text:#101a2e; --muted:#5a6b88; --border:#dbe4f0;
  --shadow:0 8px 24px rgba(16,26,46,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Tahoma","Noto Sans Arabic",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .25s,color .25s;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

/* ============================================================
   LAYOUT
   ============================================================ */
#app{display:flex;min-height:100vh}
#sidebar{
  width:var(--sidebar); flex:0 0 var(--sidebar); background:var(--bg2);
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; overflow:hidden; z-index:50;
  transition:transform .25s;
}
[dir="rtl"] #sidebar{border-right:0;border-left:1px solid var(--border)}
.brand{padding:18px 16px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--border)}
.brand .logo{
  width:40px;height:40px;border-radius:11px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--primary),var(--purple));
  display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(79,140,255,.35)
}
.brand h1{font-size:14px;font-weight:700;line-height:1.25}
.brand small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  cursor:pointer;color:var(--muted);font-size:12.8px;font-weight:600;
  transition:.16s;margin-bottom:2px;user-select:none;white-space:nowrap;
}
.nav-item:hover{background:var(--card2);color:var(--text)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(79,140,255,.22),rgba(79,140,255,.05));
  color:var(--primary);box-shadow:inset 2px 0 0 var(--primary);
}
[dir="rtl"] .nav-item.active{box-shadow:inset -2px 0 0 var(--primary);
  background:linear-gradient(270deg,rgba(79,140,255,.22),rgba(79,140,255,.05))}
.nav-item .ic{font-size:15px;width:20px;text-align:center;flex:0 0 20px}
.side-foot{padding:10px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);text-align:center}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;
}
.tb-title{font-size:15px;font-weight:800;margin-inline-end:auto}
.tb-info{font-size:11px;color:var(--muted);font-weight:600}
.tb-info b{color:var(--text)}

.btn{
  border:1px solid var(--border);background:var(--card2);color:var(--text);
  padding:8px 13px;border-radius:9px;cursor:pointer;font-size:12.2px;font-weight:700;
  font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--card);border-color:var(--primary);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(79,140,255,.32)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:var(--green);border-color:transparent;color:#04240f}
.btn.red{background:var(--red);border-color:transparent;color:#fff}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:7px}
.btn.ghost{background:transparent}

#content{padding:16px;flex:1}
.page{display:none;animation:fade .28s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   CARDS / GRID / KPI
   ============================================================ */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1400px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:760px){.g2,.g4,.g6{grid-template-columns:1fr}}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-h h3{font-size:13px;font-weight:800;letter-spacing:.2px}
.card-h .sub{font-size:11px;color:var(--muted);font-weight:600}

.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .18s,border-color .18s;
}
.kpi:hover{transform:translateY(-3px);border-color:var(--primary)}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--primary)}
.kpi.green::after{background:var(--green)} .kpi.red::after{background:var(--red)}
.kpi.amber::after{background:var(--amber)} .kpi.purple::after{background:var(--purple)}
.kpi.cyan::after{background:var(--cyan)} .kpi.pink::after{background:var(--pink)}
.kpi-l{font-size:10.8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-v{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.kpi-s{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600}

.chart-box{position:relative;height:280px;width:100%}
.chart-box.tall{height:340px}
.chart-box.sm{height:230px}

/* ============================================================
   TABLES
   ============================================================ */
.tbl-wrap{overflow:auto;max-height:560px;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{
  position:sticky;top:0;background:var(--card2);color:var(--muted);font-weight:800;
  text-align:start;padding:9px 11px;white-space:nowrap;font-size:10.8px;
  text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);z-index:2;
}
tbody td{padding:8px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card2)}
.num{text-align:end;font-variant-numeric:tabular-nums}
.tl{text-align:start}
.badge{
  display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;
  letter-spacing:.3px;white-space:nowrap;
}
.b-red{background:rgba(239,68,68,.16);color:#ff7b7b}
.b-green{background:rgba(34,197,94,.16);color:#43e087}
.b-amber{background:rgba(245,158,11,.18);color:#fbbf24}
.b-blue{background:rgba(79,140,255,.18);color:#7fb0ff}
.b-purple{background:rgba(168,85,247,.18);color:#c084fc}
.b-cyan{background:rgba(6,182,212,.18);color:#22d3ee}
.b-gray{background:rgba(139,154,181,.16);color:var(--muted)}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700}
.field input,.field select{
  background:var(--card2);border:1px solid var(--border);color:var(--text);
  padding:8px 11px;border-radius:9px;font-size:12.3px;font-family:inherit;min-width:140px;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--primary)}
input[type="search"]{background:var(--card2);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:9px;font-size:12.3px;font-family:inherit;outline:none;min-width:220px}
input[type="search"]:focus{border-color:var(--primary)}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:70px 20px;text-align:center;color:var(--muted);
}
.empty-state .es-icon{font-size:64px;opacity:.55;filter:grayscale(.2)}
.empty-state h2{font-size:19px;color:var(--text);font-weight:800}
.empty-state p{max-width:560px;line-height:1.7;font-size:13px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:12.5px}

/* Upload */
.dropzone{
  border:2px dashed var(--border);border-radius:var(--radius);padding:42px 20px;text-align:center;
  cursor:pointer;transition:.2s;background:var(--card);
}
.dropzone:hover,.dropzone.drag{border-color:var(--primary);background:rgba(79,140,255,.06)}
.dropzone .dz-ic{font-size:44px;margin-bottom:10px}
.dropzone h3{font-size:15px;margin-bottom:6px}
.dropzone p{font-size:12px;color:var(--muted)}

.progress{height:9px;background:var(--card2);border-radius:20px;overflow:hidden;margin-top:12px}
.progress > i{display:block;height:100%;width:0;border-radius:20px;
  background:linear-gradient(90deg,var(--primary),var(--purple));transition:width .3s}
.steps{display:flex;flex-direction:column;gap:7px;margin-top:14px;font-size:12px}
.step{display:flex;gap:9px;align-items:center;color:var(--muted)}
.step.done{color:var(--green)} .step.active{color:var(--primary);font-weight:700}
.step .dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:9px;flex:0 0 16px}

.alert{padding:11px 14px;border-radius:10px;font-size:12.3px;font-weight:600;line-height:1.6;margin-bottom:12px}
.alert.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#ff8b8b}
.alert.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#fbbf24}
.alert.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#4ade80}
.alert.info{background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.35);color:#8ab6ff}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:200;padding:20px}
#modal.on{display:grid}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:22px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.modal-box h3{font-size:15px;margin-bottom:10px}
.modal-box p{font-size:12.8px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.modal-actions{display:flex;gap:9px;justify-content:flex-end}

/* Toast */
#toast{position:fixed;bottom:22px;inset-inline-end:22px;z-index:300;display:flex;flex-direction:column;gap:9px}
.toast{
  background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--primary);
  padding:11px 16px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);
  animation:slideIn .25s ease;max-width:340px;
}
.toast.ok{border-inline-start-color:var(--green)}
.toast.err{border-inline-start-color:var(--red)}
.toast.warn{border-inline-start-color:var(--amber)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
[dir="rtl"] @keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}

/* Misc */
.hide{display:none!important}
.stat-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.3px}
.stat-line:last-child{border:0}
.stat-line span:first-child{color:var(--muted);font-weight:600}
.stat-line span:last-child{font-weight:800}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;background:var(--card2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--primary);color:var(--primary)}

#hamburger{display:none}
@media(max-width:980px){
  #sidebar{position:fixed;inset-inline-start:0;top:0;transform:translateX(-105%)}
  [dir="rtl"] #sidebar{transform:translateX(105%)}
  #sidebar.open{transform:translateX(0)!important;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #hamburger{display:inline-flex}
}
@media print{
  #sidebar,#topbar,.toolbar,.btn{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #ccc}
}
</style>

/* ================================================================
   3. PERSISTENT STORAGE (IndexedDB for datasets, localStorage for settings)
   ================================================================ */
const DB = (() => {
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const rq = indexedDB.open('msid_db', 1);
      rq.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('uploads')) db.createObjectStore('uploads', {keyPath:'id'});
      };
      rq.onsuccess = e => res(e.target.result);
      rq.onerror = e => rej(e.target.error);
    });
    return dbp;
  }
  async function run(mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const tr = db.transaction('uploads', mode);
      const rq = fn(tr.objectStore('uploads'));
      tr.oncomplete = () => res(rq ? rq.result : undefined);
      tr.onerror = () => rej(tr.error);
    });
  }
  return {
    put: o => run('readwrite', os => os.put(o)),
    all: () => run('readonly', os => os.getAll()),
    get: id => run('readonly', os => os.get(id)),
    del: id => run('readwrite', os => os.delete(id))
  };
})();

/* ================================================================
   4. NUMBER / TEXT PARSING
   ================================================================ */
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

function toNum(v){
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).trim();
  // convert Arabic-Indic / Persian digits
  s = s.replace(/[\u0660-\u0669]/g, d => AR_DIGITS.indexOf(d))
       .replace(/[\u06F0-\u06F9]/g, d => FA_DIGITS.indexOf(d));
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/,/g, '').replace(/[^\d.\-+]/g, '');
  if (s === '' || s === '-' || s === '+') return 0;
  let n = parseFloat(s);
  if (!isFinite(n)) return 0;
  return neg ? -n : n;
}
function toStr(v){
  if (v === null || v === undefined) return '';
  if (typeof v === 'number'){
    // preserve integers as plain text, avoid scientific notation
    return Number.isInteger(v) ? String(v) : String(v);
  }
  return String(v).trim();
}

/* ================================================================
   5. COLUMN AUTO-DETECTION
   ================================================================ */
function normHeader(s){
  return String(s === null || s === undefined ? '' : s)
    .toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')     // diacritics + tatweel
    .replace(/[\u0623\u0625\u0622\u0627]/g, '\u0627') // alef forms
    .replace(/\u0649/g, '\u064A')                     // alef maksura
    .replace(/\u0629/g, '\u0647')                     // ta marbuta
    .replace(/\u0624/g, '\u0648').replace(/\u0626/g, '\u064A')
    .replace(/[\s\-_./\\%#:()\[\]|،,]/g, '');
}

const FIELD_ALIASES = {
  itemCode:  ['رقمالصنف','كودالصنف','رقمالماده','كودالماده','الصنف','itemcode','itemno','itemnumber','itemid','productcode','productid','sku','code'],
  itemName:  ['اسمالصنف','اسمالصنفبالعربي','اسمالصنفبالانجليزي','الصنف','itemname','productname','itemdescription','description','item','product'],
  branchCode:['رقمالمخزن','كودالمخزن','رقمالفرع','كودالفرع','المخزن','الفرع','branchcode','branchno','branchnumber','branchid','branch','storecode','store','warehousecode','warehouse','outlet'],
  subCode:   ['رقمالمجموعهالفرعيه','كودالمجموعهالفرعيه','رقمالمجموعةالفرعية','subgroupcode','subgroupid','subgroupno','groupcode','subcode'],
  subName:   ['اسمالمجموعهالفرعيه','اسمالمجموعةالفرعية','المجموعهالفرعيه','المجموعةالفرعية','subgroupname','subgroup','groupname','category','department','dept'],
  unit:      ['الوحده','وحدهالقياس','الوحدة','unit','uom','unitofmeasure','measure'],
  qty:       ['صافيالكميه','صافيالكمية','الكميهالمباعه','الكميةالمباعة','كميةالمبيعات','صافيالكميةالمباعة','netquantity','netsalesquantity','salesqty','salesquantity','quantitysold','quantity','qty','soldqty'],
  sales:     ['صافيالفاتوره','صافيالفاتورة','صافيالمبيعات','قيمةالمبيعات','المبيعات','اجماليالمبيعات','netinvoice','netsales','salesamount','salesvalue','sales','revenue','netamount','amount','total'],
  cost:      ['التكلفه','التكلفة','تكلفةالمبيعات','اجماليالتكلفه','totalcost','costamount','costvalue','cost','cogs'],
  profit:    ['هامشالربح','الربح','صافيالربح','اجماليالربح','profitamount','grossprofit','profitvalue','profit'],
  margin:    ['النسبه','نسبةالربح','نسبهالربح','هامشالربح%','الهامش','marginpercent','profitmarginpercent','profitmargin','marginpct','marginratio','margin','pct'],
  stock:     ['الكميهالمتوفره','الكميةالمتوفرة','الكميهالمتاحه','المتوفره','المتاح','المخزون','رصيدالمخزون','الرصيد','availablequantity','availableqty','qtyavailable','stockqty','stockonhand','onhand','balance','available','stock','inventory']
};
const FIELD_ORDER = ['itemCode','itemName','branchCode','subCode','subName','unit','qty','sales','cost','profit','margin','stock'];

function detectColumns(headers){
  const map = {};
  const used = new Set();
  const hs = headers.map((h, i) => ({i, n: normHeader(h), raw: h}));

  // PASS 1 — exact normalised match
  for (const f of FIELD_ORDER){
    const aliases = FIELD_ALIASES[f].map(normHeader);
    for (const h of hs){
      if (used.has(h.i) || !h.n) continue;
      if (aliases.includes(h.n)){ map[f] = h.i; used.add(h.i); break; }
    }
  }
  // PASS 2 — longest-alias substring match (header-centric, avoids mis-assignment)
  for (const h of hs){
    if (used.has(h.i) || !h.n || h.n.length < 3) continue;
    let best = null, bestLen = 0;
    for (const f of FIELD_ORDER){
      if (map[f] !== undefined) continue;
      for (const a of FIELD_ALIASES[f]){
        const na = normHeader(a);
        if (na.length >= 3 && h.n.includes(na) && na.length > bestLen){
          best = f; bestLen = na.length;
        }
      }
    }
    if (best){ map[best] = h.i; used.add(h.i); }
  }
  return map;
}

/* ================================================================
   6. EXCEL → RECORDS
   ================================================================ */
function parseWorkbook(wb){
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  if (!aoa.length) throw new Error('EMPTY_FILE');

  // find the header row (first row with >= 3 non-empty cells)
  let headerRow = 0;
  for (let i = 0; i < Math.min(aoa.length, 15); i++){
    const filled = aoa[i].filter(c => c !== '' && c !== null && c !== undefined).length;
    if (filled >= 3){ headerRow = i; break; }
  }
  const headers = aoa[headerRow] || [];
  const map = detectColumns(headers);

  const report = {
    sheet: sheetName,
    headers: headers.map(h => toStr(h)),
    detected: map,
    missing: [],
    warnings: [],
    totalRows: 0,
    skipped: 0,
    duplicates: 0,
    rows: []
  };

  // Required columns check
  if (map.branchCode === undefined) report.missing.push('رقم المخزن / Branch Code');
  if (map.itemCode === undefined)   report.missing.push('رقم الصنف / Item Code');
  if (map.sales === undefined && map.qty === undefined)
    report.missing.push('صافي الفاتورة أو صافي الكمية / Net Invoice or Net Quantity');
  if (report.missing.length) return report;

  // Optional warnings
  ['cost','profit','stock','margin','subName','itemName'].forEach(f => {
    if (map[f] === undefined) report.warnings.push(f);
  });

  const get = (r, f) => (map[f] !== undefined ? r[map[f]] : undefined);

  for (let i = headerRow + 1; i < aoa.length; i++){
    const r = aoa[i];
    if (!r || r.every(c => c === '' || c === null || c === undefined)) continue;
    report.totalRows++;

    const itemCode   = toStr(get(r,'itemCode'));
    const branchCode = toStr(get(r,'branchCode'));
    if (!itemCode || !branchCode){ report.skipped++; continue; }

    const sales  = toNum(get(r,'sales'));
    const cost   = toNum(get(r,'cost'));
    let   profit = (map.profit !== undefined) ? toNum(get(r,'profit')) : (sales - cost);
    let   margin = (map.margin !== undefined) ? toNum(get(r,'margin')) : null;

    report.rows.push({
      itemCode,
      itemName: toStr(get(r,'itemName')) || t('missingItem'),
      branchCode,
      subCode: toStr(get(r,'subCode')),
      subName: toStr(get(r,'subName')) || '—',
      unit: toStr(get(r,'unit')) || '—',
      qty: toNum(get(r,'qty')),
      sales, cost, profit, margin,
      stock: toNum(get(r,'stock'))
    });
  }
  return report;
}

/* ================================================================
   7. ANALYTICS MODEL
   ================================================================ */
function buildModel(records, settings){
  const st = settings;
  // ---- aggregate duplicate item+branch rows -------------------
  const agg = new Map();
  for (const r of records){
    const k = r.branchCode + '\u0001' + r.itemCode;
    let o = agg.get(k);
    if (!o){
      o = {
        itemCode:r.itemCode, itemName:r.itemName, branchCode:r.branchCode,
        subCode:r.subCode, subName:r.subName, unit:r.unit,
        qty:r.qty, sales:r.sales, cost:r.cost, profit:r.profit,
        stock:r.stock, dups:0
      };
      agg.set(k, o);
    } else {
      o.qty += r.qty; o.sales += r.sales; o.cost += r.cost; o.profit += r.profit;
      o.stock = Math.max(o.stock, r.stock);
      o.dups++;
    }
  }
  const recs = [...agg.values()];

  // ---- margins -------------------------------------------------
  for (const r of recs){
    r.margin = r.sales ? (r.profit / r.sales) * 100 : 0;
    if (!isFinite(r.margin)) r.margin = 0;
  }

  // ---- group by branch ----------------------------------------
  const bmap = new Map();
  for (const r of recs){
    if (!bmap.has(r.branchCode)) bmap.set(r.branchCode, []);
    bmap.get(r.branchCode).push(r);
  }

  // ---- ABC movement classification (per branch) ---------------
  const cuts = st.abc;
  bmap.forEach(list => {
    const moving = list.filter(r => r.qty > 0).sort((a,b) => b.qty - a.qty);
    const tot = moving.reduce((a,b) => a + b.qty, 0);
    let cum = 0;
    moving.forEach((r, idx) => {
      cum += r.qty;
      const p = tot ? cum / tot : 1;
      r.movement = p <= cuts.A ? 'veryFast'
                 : p <= cuts.B ? 'fast'
                 : p <= cuts.C ? 'medium'
                 : 'slow';
      r.movementRank = idx + 1;
    });
    list.filter(r => r.qty <= 0).forEach(r => { r.movement = 'non'; r.movementRank = null; });
  });

  // ---- stock status (per item+branch) -------------------------
  const period = Math.max(1, st.periodDays || 30);
  for (const r of recs){
    r.avgDaily = r.qty / period;
    if (r.stock <= 0){
      r.stockStatus = 'out';
      r.coverage = 0;
    } else if (r.avgDaily > 0){
      r.coverage = r.stock / r.avgDaily;
      r.stockStatus = r.coverage < st.lowDays ? 'low'
                    : (r.coverage > st.overDays ? 'over' : 'ok');
    } else {
      r.coverage = Infinity;
      r.stockStatus = (r.stock > st.overMinQty) ? 'over' : 'ok';
    }
    // replenishment suggestion
    const target = r.avgDaily * st.targetDays;
    r.replenish = Math.max(0, target - r.stock);
    r.safety = r.avgDaily * st.safetyDays;
    r.excess = Math.max(0, r.stock - Math.max(r.safety, r.avgDaily * st.targetDays * 0.5));
  }

  // ---- branch stats -------------------------------------------
  const branchStats = [...bmap.entries()].map(([code, list]) => {
    const s = {
      code, sales:0, qty:0, cost:0, profit:0, stock:0,
      items:list.length, sold:0, out:0, low:0, over:0, fast:0, outSales:0
    };
    for (const r of list){
      s.sales += r.sales; s.qty += r.qty; s.cost += r.cost;
      s.profit += r.profit; s.stock += r.stock;
      if (r.qty > 0) s.sold++;
      if (r.stockStatus === 'out'){ s.out++; s.outSales += r.sales; }
      else if (r.stockStatus === 'low') s.low++;
      else if (r.stockStatus === 'over') s.over++;
      if (r.movement === 'veryFast' || r.movement === 'fast') s.fast++;
    }
    s.margin = s.sales ? (s.profit / s.sales) * 100 : 0;
    return s;
  }).sort((a,b) => b.sales - a.sales);

  const grandSales = branchStats.reduce((a,b) => a + b.sales, 0);
  branchStats.forEach((b, i) => {
    b.contribution = grandSales ? (b.sales / grandSales) * 100 : 0;
    b.rank = i + 1;
    b.outContrib = b.sales ? (b.outSales / b.sales) * 100 : 0;
  });

  // ---- item stats (cross-branch) ------------------------------
  const itemMap = new Map();
  for (const r of recs){
    let it = itemMap.get(r.itemCode);
    if (!it){
      it = { code:r.itemCode, name:r.itemName, subName:r.subName, unit:r.unit,
             qty:0, sales:0, cost:0, profit:0, stock:0, branches:[] };
      itemMap.set(r.itemCode, it);
    }
    it.qty += r.qty; it.sales += r.sales; it.cost += r.cost;
    it.profit += r.profit; it.stock += r.stock;
    it.branches.push(r);
  }
  itemMap.forEach(it => { it.margin = it.sales ? (it.profit / it.sales) * 100 : 0; });

  // ---- subgroup stats -----------------------------------------
  const subMap = new Map();
  for (const r of recs){
    const key = r.subName || '—';
    let s = subMap.get(key);
    if (!s){ s = {name:key, sales:0, qty:0, profit:0, stock:0}; subMap.set(key, s); }
    s.sales += r.sales; s.qty += r.qty; s.profit += r.profit; s.stock += r.stock;
  }
  const subgroups = [...subMap.values()].sort((a,b) => b.sales - a.sales);

  // ---- totals --------------------------------------------------
  const totals = {
    sales:0, qty:0, cost:0, profit:0, stock:0,
    items:itemMap.size, branches:branchStats.length,
    out:0, low:0, over:0, fast:0
  };
  for (const r of recs){
    totals.sales += r.sales; totals.qty += r.qty; totals.cost += r.cost;
    totals.profit += r.profit; totals.stock += r.stock;
    if (r.stockStatus === 'out') totals.out++;
    else if (r.stockStatus === 'low') totals.low++;
    else if (r.stockStatus === 'over') totals.over++;
    if (r.movement === 'veryFast' || r.movement === 'fast') totals.fast++;
  }
  totals.margin = totals.sales ? (totals.profit / totals.sales) * 100 : 0;

  return { records:recs, branchStats, itemMap, subgroups, totals, settings:st };
}

/* ================================================================
   8. PRIORITY HELPERS
   ================================================================ */
function outPriority(r){
  if (r.qty <= 0) return 'inactive';
  if (r.movement === 'veryFast' || r.movement === 'fast') return 'critical';
  if (r.movement === 'medium') return 'high';
  return 'normal';
}
function priorityBadge(p){
  const map = {critical:['b-red','prCritical'], high:['b-amber','prHigh'], normal:['b-blue','prNormal'], inactive:['b-gray','prInactive']};
  const [cls, key] = map[p] || map.normal;
  return '<span class="badge ' + cls + '">' + t(key) + '</span>';
}
function stockBadge(s){
  const map = {out:['b-red','stOut'], low:['b-amber','stLow'], over:['b-purple','stOver'], ok:['b-green','stOk']};
  const [cls, key] = map[s] || map.ok;
  return '<span class="badge ' + cls + '">' + t(key) + '</span>';
}
function movementBadge(m){
  const map = {veryFast:['b-green','mvVeryFast'], fast:['b-cyan','mvFast'], medium:['b-blue','mvMedium'], slow:['b-amber','mvSlow'], non:['b-gray','mvNon']};
  const [cls, key] = map[m] || map.slow;
  return '<span class="badge ' + cls + '">' + t(key) + '</span>';
}

/* ================================================================
   9. TRANSFER RECOMMENDATION ENGINE
   ================================================================ */
function generateTransfers(){
  const M = S.model;
  if (!M) return [];
  const st = M.settings;
  const byItem = new Map();
  for (const r of M.records){
    if (!byItem.has(r.itemCode)) byItem.set(r.itemCode, []);
    byItem.get(r.itemCode).push(r);
  }

  const out = [];
  let seq = 1;

  for (const [code, list] of byItem){
    // skip totally inactive products (rule 5)
    const itemTotalQty = list.reduce((a,b) => a + b.qty, 0);
    if (itemTotalQty <= 0) continue;

    // SOURCES: overstocked branches with real excess above safety stock
    const sources = list
      .filter(r => r.stockStatus === 'over' && r.stock > 0)
      .map(r => {
        const keep = Math.max(r.avgDaily * st.safetyDays, 0);
        const transferable = Math.max(0, r.stock - keep);
        return { rec:r, avail: Math.floor(transferable) };
      })
      .filter(s => s.avail >= 1)
      .sort((a,b) => b.avail - a.avail);
    if (!sources.length) continue;

    // DESTINATIONS: out-of-stock or low-stock branches that actually sell the item
    const dests = list
      .filter(r => (r.stockStatus === 'out' || r.stockStatus === 'low') && r.avgDaily > 0)
      .map(r => {
        const target = r.avgDaily * st.targetDays;
        const need = Math.floor(Math.max(0, target - r.stock));
        return { rec:r, need };
      })
      .filter(d => d.need >= 1)
      .sort((a,b) => b.rec.avgDaily - a.rec.avgDaily || a.rec.stock - b.rec.stock);
    if (!dests.length) continue;

    for (const d of dests){
      let need = d.need;
      for (const s of sources){
        if (need <= 0) break;
        if (s.avail <= 0) continue;
        if (s.rec.branchCode === d.rec.branchCode) continue;

        const qty = Math.min(need, s.avail);
        if (qty < 1) continue;

        const pr = (d.rec.stock <= 0 && (d.rec.movement === 'veryFast' || d.rec.movement === 'fast'))
          ? 'critical'
          : (d.rec.stock <= 0 || d.rec.movement === 'veryFast' || d.rec.movement === 'fast')
            ? 'high' : 'normal';

        out.push({
          id: 'TR-' + String(seq++).padStart(4,'0'),
          itemCode: code,
          itemName: d.rec.itemName,
          subName: d.rec.subName,
          source: s.rec.branchCode,
          dest: d.rec.branchCode,
          srcStock: s.rec.stock,
          dstStock: d.rec.stock,
          dstVelocity: d.rec.avgDaily,
          dstMovement: d.rec.movement,
          qty: qty,
          maxQty: qty,
          priority: pr,
          status: 'pending',
          reason: buildReason(s.rec, d.rec, qty)
        });

        s.avail -= qty;
        need -= qty;
      }
    }
  }

  // sort: critical first, then by destination velocity
  const rank = {critical:0, high:1, normal:2};
  out.sort((a,b) => rank[a.priority] - rank[b.priority] || b.dstVelocity - a.dstVelocity);
  return out;
}

function buildReason(src, dst, qty){
  const ar = S.lang === 'ar';
  const mv = t(dst.movement === 'veryFast' ? 'mvVeryFast' : dst.movement === 'fast' ? 'mvFast' : dst.movement === 'medium' ? 'mvMedium' : 'mvSlow');
  if (ar){
    return 'الفرع المستلم: ' + (dst.stock <= 0 ? 'مخزون نافذ' : 'مخزون منخفض') +
           ' · حركة الصنف: ' + mv +
           ' · متوسط البيع اليومي ' + nf(dst.avgDaily,2) +
           ' · المصدر لديه فائض ' + nf(src.stock,0) + ' وحدة (بعد احتياطي الأمان)';
  }
  return 'Destination ' + (dst.stock <= 0 ? 'OUT of stock' : 'LOW stock') +
         ' · movement: ' + mv +
         ' · est. daily sales ' + nf(dst.avgDaily,2) +
         ' · source holds ' + nf(src.stock,0) + ' units (excess above safety stock)';
}

   10. CHART ENGINE
   ================================================================ */
const CHART_REGISTRY = {};
const PALETTE = ['#4f8cff','#22c55e','#f59e0b','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#8b5cf6','#0ea5e9'];

function chartColors(){
  const cs = getComputedStyle(document.documentElement);
  return {
    text: cs.getPropertyValue('--muted').trim() || '#8b9ab5',
    grid: cs.getPropertyValue('--border').trim() || '#2a3550'
  };
}
function destroyCharts(){
  Object.keys(CHART_REGISTRY).forEach(k => {
    try { CHART_REGISTRY[k].destroy(); } catch(e){}
    delete CHART_REGISTRY[k];
  });
}
function mkChart(id, type, data, opts){
  const el = document.getElementById(id);
  if (!el || typeof Chart === 'undefined') return;
  if (CHART_REGISTRY[id]){ try{ CHART_REGISTRY[id].destroy(); }catch(e){} }
  const c = chartColors();
  const base = {
    responsive:true,
    maintainAspectRatio:false,
    animation:{duration:700, easing:'easeOutQuart'},
    plugins:{
      legend:{ display:true, labels:{ color:c.text, boxWidth:12, font:{size:11}, padding:12 } },
      tooltip:{
        backgroundColor:'rgba(16,22,36,.94)', titleColor:'#fff', bodyColor:'#dbe4f0',
        borderColor:c.grid, borderWidth:1, padding:10, cornerRadius:8, displayColors:true
      }
    },
    scales: (type === 'doughnut' || type === 'pie' || type === 'radar') ? undefined : {
      x:{ ticks:{ color:c.text, font:{size:10}, maxRotation:45, minRotation:0 }, grid:{ color:c.grid + '55' } },
      y:{ ticks:{ color:c.text, font:{size:10} }, grid:{ color:c.grid + '55' }, beginAtZero:true }
    }
  };
  const merged = Object.assign({}, base, opts || {});
  merged.plugins = Object.assign({}, base.plugins, (opts && opts.plugins) || {});
  if (!(opts && opts.scales)) merged.scales = base.scales;
  CHART_REGISTRY[id] = new Chart(el.getContext('2d'), {type, data, options:merged});
}

function tableHTML(cols, rows, emptyMsg){
  if (!rows || !rows.length) return '<div class="empty">' + (emptyMsg || t('noData')) + '</div>';
  const head = cols.map(c => '<th class="' + (c.cls || '') + '">' + c.label + '</th>').join('');
  const body = rows.map(r =>
    '<tr>' + cols.map(c => '<td class="' + (c.cls || '') + '">' + (c.render ? c.render(r) : esc(r[c.key])) + '</td>').join('') + '</tr>'
  ).join('');
  return '<div class="tbl-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}
function kpiCard(label, value, sub, cls){
  return '<div class="kpi ' + (cls || '') + '">' +
    '<div class="kpi-l">' + label + '</div>' +
    '<div class="kpi-v">' + value + '</div>' +
    (sub ? '<div class="kpi-s">' + sub + '</div>' : '') +

}

    inner + '</div>';

}

/* ---------- 13.4 PRODUCT SALES COMPARISON ---------- */
RENDER.product = function(el){
  if (!S.model){ el.innerHTML = emptyPage(); return; }
  const M = S.model;
  const items = [...M.itemMap.values()].sort((a,b) => b.sales - a.sales);
  if (!S.selItem || !M.itemMap.has(S.selItem)) S.selItem = items.length ? items[0].code : null;
  if (!S.selItem){ el.innerHTML = '<div class="empty">' + t('noData') + '</div>'; return; }

  const opts = items.slice(0, 800).map(i =>
    '<option value="' + esc(i.code) + '"' + (i.code===S.selItem?' selected':'') + '>' +
    esc(i.code) + ' — ' + esc(i.name) + '</option>').join('');

  let html = '<div class="toolbar">' +
    '<div class="field" style="min-width:260px"><span>' + t('search') + '</span>' +
      '<input type="search" id="itemSearch" placeholder="' + t('thItemName') + ' / ' + t('thItemCode') + '"></div>' +
    '<div class="field" style="min-width:320px"><span>' + t('item') + '</span>' +
      '<select id="itemSel">' + opts + '</select></div>' +
    '<button class="btn green" data-act="exportItemComparison">📗 ' + t('exportExcel') + '</button>' +
    '<button class="btn red" data-act="pdfItemComparison">📕 ' + t('exportPDF') + '</button>' +
  '</div>';

  const it = M.itemMap.get(S.selItem);
  const recs = [...it.branches].sort((a,b) => b.qty - a.qty);

  // insights
  const fastest = recs.reduce((a,b) => (b.qty > a.qty ? b : a), recs[0]);
  const highestStock = recs.reduce((a,b) => (b.stock > a.stock ? b : a), recs[0]);
  const zeroStock = recs.filter(r => r.stock <= 0);
  const needReplenish = recs.filter(r => r.stockStatus === 'out' || r.stockStatus === 'low');
  const excess = recs.filter(r => r.stockStatus === 'over');

  html += '<div class="grid g4" style="margin-bottom:14px">';
  html += kpiCard(t('thItemCode'), esc(it.code), esc(it.name), 'cyan');
  html += kpiCard(t('kpiSales'), money(it.sales), nf(it.qty) + ' ' + t('thQty'), 'green');
  html += kpiCard(t('kpiProfit'), money(it.profit), t('kpiMargin') + ': ' + pct(it.margin), 'purple');
  html += kpiCard(t('kpiStock'), nf(it.stock), recs.length + ' ' + t('kpiBranches'), 'amber');
  html += '</div>';

  html += '<div class="grid g2" style="margin-bottom:14px">';
  html += card(t('thBranch'), '',
    '<div class="stat-line"><span>' + t('thFastest') + '</span><span>' + esc(fastest ? fastest.branchCode : '—') + ' (' + nf(fastest?fastest.qty:0) + ')</span></div>' +
    '<div class="stat-line"><span>' + t('thHighestStock') + '</span><span>' + esc(highestStock ? highestStock.branchCode : '—') + ' (' + nf(highestStock?highestStock.stock:0) + ')</span></div>' +
    '<div class="stat-line"><span>' + t('thZeroStock') + '</span><span>' + (zeroStock.length ? zeroStock.map(r=>esc(r.branchCode)).join(', ') : '—') + '</span></div>' +
    '<div class="stat-line"><span>' + t('thNeedReplenish') + '</span><span>' + (needReplenish.length ? needReplenish.map(r=>esc(r.branchCode)).join(', ') : '—') + '</span></div>' +
    '<div class="stat-line"><span>' + t('thExcessStock') + '</span><span>' + (excess.length ? excess.map(r=>esc(r.branchCode)).join(', ') : '—') + '</span></div>'
  );
  html += chartCard(t('thSales') + ' / ' + t('thStock'), 'pc1', null, 'sm');
  html += '</div>';

  const cols = [
    {label:t('thBranch'), cls:'tl', render:r => '<b>' + esc(r.branchCode) + '</b>'},
    {label:t('thQty'), cls:'num', render:r => nf(r.qty)},
    {label:t('thSales'), cls:'num', render:r => money(r.sales)},
    {label:t('thCost'), cls:'num', render:r => money(r.cost)},
    {label:t('thProfit'), cls:'num', render:r => money(r.profit)},
    {label:t('thMargin'), cls:'num', render:r => pct(r.margin)},
    {label:t('thStock'), cls:'num', render:r => nf(r.stock)},
    {label:t('thStatus'), cls:'tl', render:r => stockBadge(r.stockStatus)},
    {label:t('thMovement'), cls:'tl', render:r => movementBadge(r.movement)}
  ];
  html += card(t('navProduct') + ' — ' + esc(it.name), recs.length + ' ' + t('kpiBranches'), tableHTML(cols, recs));

  el.innerHTML = html;

  $('#itemSel').addEventListener('change', e => { S.selItem = e.target.value; RENDER.product(el); });
  $('#itemSearch').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    const sel = $('#itemSel');
    [...sel.options].forEach(o => { o.hidden = !!(q && !o.text.toLowerCase().includes(q)); });
  });

  mkChart('pc1','bar',{ labels:recs.map(r=>r.branchCode), datasets:[
    { label:t('thSales'), data:recs.map(r=>r.sales), backgroundColor:PALETTE[0], borderRadius:6, yAxisID:'y' },
    { label:t('thStock'), data:recs.map(r=>r.stock), type:'line', borderColor:PALETTE[3],
      backgroundColor:PALETTE[3]+'33', tension:.35, pointRadius:4, yAxisID:'y1' }
  ]}, { scales:{
    x:{ ticks:{ color:chartColors().text, font:{size:10} }, grid:{ color:chartColors().grid+'55' } },
    y:{ position:'left', beginAtZero:true, ticks:{ color:chartColors().text, font:{size:10} }, grid:{ color:chartColors().grid+'55' } },
    y1:{ position:'right', beginAtZero:true, ticks:{ color:chartColors().text, font:{size:10} }, grid:{ display:false } }
  }});
};

/* ---------- 13.5 STOCK PAGES (OOS / LOW / OVER) ---------- */
function renderStockPage(el, kind){
  if (!S.model){ el.innerHTML = emptyPage(); return; }
  const M = S.model;
  const codes = M.branchStats.map(b => b.code);

  const titles = {out:t('navOOS'), low:t('navLow'), over:t('navOver')};
  let recs = M.records.filter(r => r.stockStatus === kind);

  // branch filter
  let filter = S.quickFilter[kind] || 'all';
  const opts = ['<option value="all"' + (filter==='all'?' selected':'') + '>' + t('allBranches') + '</option>']
    .concat(codes.map(c => '<option value="' + esc(c) + '"' + (c===filter?' selected':'') + '>' + esc(c) + '</option>'))
    .join('');

  if (filter !== 'all') recs = recs.filter(r => r.branchCode === filter);

  if (kind === 'out'){
    const rank = {critical:0, high:1, normal:2, inactive:3};
    recs.sort((a,b) => rank[outPriority(a)] - rank[outPriority(b)] || b.sales - a.sales);
  } else if (kind === 'low'){
    recs.sort((a,b) => a.coverage - b.coverage);
  } else {
    recs.sort((a,b) => b.excess - a.excess);
  }

  let html = '<div class="toolbar">' +
    '<div class="field"><span>' + t('thBranch') + '</span><select id="stockBranch">' + opts + '</select></div>' +
    '<button class="btn green" data-act="exportStock" data-kind="' + kind + '">📗 ' + t('exportExcel') + '</button>' +
    '<button class="btn red" data-act="pdfStock" data-kind="' + kind + '">📕 ' + t('exportPDF') + '</button>' +
    '<button class="btn" data-act="printPage">🖨 ' + t('print') + '</button>' +
  '</div>';

  // summary
  const totalSalesAll = M.totals.sales || 1;
  const salesOfSet = recs.reduce((a,b) => a + b.sales, 0);
  html += '<div class="grid g4" style="margin-bottom:14px">';
  html += kpiCard(t('thItems'), nf(recs.length), null, kind==='out'?'red':kind==='low'?'amber':'purple');
  html += kpiCard(t('thSales'), money(salesOfSet), null, '');
  html += kpiCard(t('thContribution'), pct(salesOfSet / totalSalesAll * 100), null, 'cyan');
  html += kpiCard(t('kpiStock'), nf(recs.reduce((a,b)=>a+b.stock,0)), null, 'green');
  html += '</div>';

  if (kind === 'out'){
    html += '<div class="alert info">' + t('trNote') + '</div>';
  }

  let cols;
  if (kind === 'out'){
    cols = [
      {label:t('thBranchCode'), cls:'tl', render:r => '<b>' + esc(r.branchCode) + '</b>'},
      {label:t('thItemCode'), cls:'tl', render:r => esc(r.itemCode)},
      {label:t('thItemName'), cls:'tl', render:r => esc(r.itemName)},
      {label:t('thSubgroup'), cls:'tl', render:r => esc(r.subName)},
      {label:t('thQty'), cls:'num', render:r => nf(r.qty)},
      {label:t('thSales'), cls:'num', render:r => money(r.sales)},
      {label:t('thProfit'), cls:'num', render:r => money(r.profit)},
      {label:t('thStock'), cls:'num', render:r => nf(r.stock)},
      {label:t('thPriority'), cls:'tl', render:r => priorityBadge(outPriority(r))}
    ];
  } else if (kind === 'low'){
    cols = [
      {label:t('thBranchCode'), cls:'tl', render:r => '<b>' + esc(r.branchCode) + '</b>'},
      {label:t('thItemCode'), cls:'tl', render:r => esc(r.itemCode)},
      {label:t('thItemName'), cls:'tl', render:r => esc(r.itemName)},
      {label:t('thSubgroup'), cls:'tl', render:r => esc(r.subName)},
      {label:t('thQty'), cls:'num', render:r => nf(r.qty)},
      {label:t('thStock'), cls:'num', render:r => nf(r.stock)},
      {label:t('thAvgDaily'), cls:'num', render:r => nf(r.avgDaily,2)},
      {label:t('thCoverage'), cls:'num', render:r => nf(r.coverage,1)},
      {label:t('thReplenish'), cls:'num', render:r => '<b>' + nf(r.replenish) + '</b>'}
    ];
  } else {
    cols = [
      {label:t('thBranchCode'), cls:'tl', render:r => '<b>' + esc(r.branchCode) + '</b>'},
      {label:t('thItemCode'), cls:'tl', render:r => esc(r.itemCode)},
      {label:t('thItemName'), cls:'tl', render:r => esc(r.itemName)},
      {label:t('thSubgroup'), cls:'tl', render:r => esc(r.subName)},
      {label:t('thQty'), cls:'num', render:r => nf(r.qty)},
      {label:t('thStock'), cls:'num', render:r => nf(r.stock)},
      {label:t('thAvgDaily'), cls:'num', render:r => nf(r.avgDaily,2)},
      {label:t('thCoverage'), cls:'num', render:r => isFinite(r.coverage) ? nf(r.coverage,1) : '∞'},
      {label:t('thExcess'), cls:'num', render:r => '<b>' + nf(r.excess) + '</b>'}
    ];
  }

  html += card(titles[kind], recs.length + ' ' + t('thItems'), tableHTML(cols, recs.slice(0, 2000)));

  el.innerHTML = html;

  $('#stockBranch').addEventListener('change', e => {
    S.quickFilter[kind] = e.target.value;
    renderStockPage(el, kind);
  });
}
RENDER.oos  = el => renderStockPage(el, 'out');
RENDER.low  = el => renderStockPage(el, 'low');
RENDER.over = el => renderStockPage(el, 'over');

/* ---------- 13.6 FAST-MOVING ---------- */
RENDER.fast = function(el){
  if (!S.model){ el.innerHTML = emptyPage(); return; }
  const M = S.model;
  const codes = M.branchStats.map(b => b.code);
  if (!S.selBranch || !codes.includes(S.selBranch)) S.selBranch = codes[0];

  let recs = M.records.filter(r => r.branchCode === S.selBranch && r.qty > 0);
  recs.sort((a,b) => b.qty - a.qty);

  const topN = S.settings.topN || 10;
  const shown = recs.slice(0, topN);

  const opts = codes.map(c => '<option value="' + esc(c) + '"' + (c===S.selBranch?' selected':'') + '>' + esc(c) + '</option>').join('');
  const topOpts = [10,20,50,100,1000].map(n =>
    '<option value="' + n + '"' + (n===topN?' selected':'') + '>' + (n===1000 ? t('total') : 'Top ' + n) + '</option>').join('');

  let html = '<div class="toolbar">' +
    '<div class="field"><span>' + t('thBranch') + '</span><select id="fastBranch">' + opts + '</select></div>' +
    '<div class="field"><span>Top-N</span><select id="fastTop">' + topOpts + '</select></div>' +
    '<button class="btn green" data-act="exportFast">📗 ' + t('exportExcel') + '</button>' +
    '<button class="btn red" data-act="pdfFast">📕 ' + t('exportPDF') + '</button>' +
  '</div>';

  html += '<div class="alert info">' + (S.lang === 'ar'
    ? 'تصنيف الحركة يُحسب لكل فرع على حدة باستخدام تحليل ABC على كميات المبيعات: سريع جدًا (حتى ' + (S.settings.abc.A*100) + '%)، سريع (حتى ' + (S.settings.abc.B*100) + '%)، متوسط (حتى ' + (S.settings.abc.C*100) + '%)، بطيء، وغير متحرك (بدون مبيعات).'
    : 'Movement classification is calculated per branch using ABC analysis on sales quantity: Very Fast (top ' + (S.settings.abc.A*100) + '%), Fast (to ' + (S.settings.abc.B*100) + '%), Medium (to ' + (S.settings.abc.C*100) + '%), Slow, and Non-Moving (zero sales).') + '</div>';

  const counts = {veryFast:0, fast:0, medium:0, slow:0, non:0};
  recs.forEach(r => counts[r.movement] = (counts[r.movement]||0) + 1);
  html += '<div class="grid g4" style="margin-bottom:14px">';
  html += kpiCard(t('mvVeryFast'), nf(counts.veryFast), null, 'green');
  html += kpiCard(t('mvFast'), nf(counts.fast), null, 'cyan');
  html += kpiCard(t('mvMedium'), nf(counts.medium), null, '');
  html += kpiCard(t('mvSlow'), nf(counts.slow), null, 'amber');
  html += '</div>';

  const cols = [
    {label:t('thRank'), cls:'num', render:(r,i) => '#' + (shown.indexOf(r)+1)},
    {label:t('thBranch'), cls:'tl', render:r => esc(r.branchCode)},
    {label:t('thItemCode'), cls:'tl', render:r => esc(r.itemCode)},
    {label:t('thItemName'), cls:'tl', render:r => esc(r.itemName)},
    {label:t('thQty'), cls:'num', render:r => nf(r.qty)},
    {label:t('thSales'), cls:'num', render:r => money(r.sales)},
    {label:t('thProfit'), cls:'num', render:r => money(r.profit)},
    {label:t('thMargin'), cls:'num', render:r => pct(r.margin)},
    {label:t('thStock'), cls:'num', render:r => nf(r.stock)},
    {label:t('thStatus'), cls:'tl', render:r => stockBadge(r.stockStatus)},
    {label:t('thMovement'), cls:'tl', render:r => movementBadge(r.movement)}
  ];

  html += card(t('navFast') + ' — ' + esc(S.selBranch), shown.length + ' ' + t('thItems'), tableHTML(cols, shown));

  el.innerHTML = html;

  $('#fastBranch').addEventListener('change', e => { S.selBranch = e.target.value; RENDER.fast(el); });
  $('#fastTop').addEventListener('change', e => { S.settings.topN = parseInt(e.target.value,10); savePrefs(); RENDER.fast(el); });
};

  if (!S.model){ el.innerHTML = emptyPage(); return; }
  const T = S.transfers;

  let html = '<div class="toolbar">' +
    '<button class="btn primary" data-act="genTransfers">' + t('btnGenerate') + '</button>' +
    '<button class="btn green" data-act="exportTransfers">📗 ' + t('exportExcel') + '</button>' +

  if (!T.length){
    html += card(t('navTransfer'), '', '<div class="empty">' + t('trEmpty') + '</div>');
    el.innerHTML = html;
    return;
  }

  const pending = T.filter(x => x.status === 'pending').length;
  const approved = T.filter(x => x.status === 'approved').length;

  html += '<div class="grid g4" style="margin-bottom:14px">';

  html += kpiCard(t('trApproved'), nf(approved), null, 'green');
  html += kpiCard(t('thTransferQty'), nf(totalUnits), null, 'purple');
  html += '</div>';

  const cols = [
    {label:t('thItemCode'), cls:'tl', render:r => '<b>' + esc(r.itemCode) + '</b>'},
    {label:t('thItemName'), cls:'tl', render:r => esc(r.itemName)},
    {label:t('thSource'), cls:'tl', render:r => '<span class="badge b-purple">' + esc(r.source) + '</span>'},
    {label:t('thDest'), cls:'tl', render:r => '<span class="badge b-blue">' + esc(r.dest) + '</span>'},
    {label:t('thSrcStock'), cls:'num', render:r => nf(r.srcStock)},

/* ================================================================
   14. FILE HANDLING
   ================================================================ */
async function handleFile(file){
  if (!file) return;
  const dz = $('#dropzone');
  const prog = $('#uploadProgress');
  const stepsBox = $('#uploadSteps');
  const bar = prog ? prog.querySelector('i') : null;

  if (prog) prog.style.display = '';
  const steps = [
    {k:'reading', label: t('upProcessing')},
    {k:'validate', label: t('upStatus')},
    {k:'process', label: t('upRecords')},
    {k:'analyze', label: t('kpiBranches')},
    {k:'done', label: t('upDone')}
  ];
  if (stepsBox){
    stepsBox.innerHTML = steps.map((s,i) =>
      '<div class="step" data-step="' + i + '"><span class="dot">' + (i+1) + '</span>' + esc(s.label) + '</div>').join('');
  }
  const setStep = (i, state) => {
    if (!stepsBox) return;
    const el = stepsBox.querySelector('[data-step="' + i + '"]');
    if (!el) return;
    el.className = 'step ' + (state || '');
    if (state === 'done') el.querySelector('.dot').textContent = '✓';
  };
  const setProgress = p => { if (bar) bar.style.width = p + '%'; };

  try{
    setStep(0,'active'); setProgress(12);
    const buf = await file.arrayBuffer();
    await sleep(120);

    const wb = XLSX.read(buf, {type:'array'});
    setStep(0,'done'); setStep(1,'active'); setProgress(32);

    const report = parseWorkbook(wb);
    await sleep(120);

    if (report.missing.length){
      setStep(1,'done');
      S.uploadMeta = {
        fileName: file.name, uploadDate: Date.now(),
        records: 0, branches: 0, products: 0,
        missing: report.missing, warnings: [], valid:false,
        skipped: report.skipped, duplicates: 0
      };
      renderUploadReport(S.uploadMeta);
      setProgress(100);
      toast(t('upMissingCols') + ': ' + report.missing.join(', '), 'err');
      return;
    }

    setStep(1,'done'); setStep(2,'active'); setProgress(58);
    S.rows = report.rows;

    const model = buildModel(report.rows, S.settings);
    setStep(2,'done'); setStep(3,'active'); setProgress(82);
    S.model = model;
    S.transfers = [];
    S.selBranch = model.branchStats.length ? model.branchStats[0].code : null;
    S.selItem = null;

    let dupCount = 0;
    model.records.forEach(r => { if (r.dups) dupCount += r.dups; });

    S.uploadMeta = {
      fileName: file.name,
      uploadDate: Date.now(),
      records: report.rows.length,
      branches: model.totals.branches,
      products: model.totals.items,
      missing: [],
      warnings: report.warnings,
      skipped: report.skipped,
      duplicates: dupCount,
      valid: true
    };

    await sleep(180);
    setStep(3,'done'); setStep(4,'active'); setProgress(96);

    // persist in history
    const id = 'UP-' + new Date().toISOString().replace(/[-:T.Z]/g,'').slice(0,14);
    try{
            const { data: authData } = await window.halaSupabase.auth.getSession();

      if (!authData.session) {
        const email = prompt('Admin email:');
        const password = prompt('Admin password:');

        if (!email || !password) throw new Error('Admin login cancelled');

        const { error: loginError } = await window.halaSupabase.auth.signInWithPassword({
          email,
          password
        });

        if (loginError) throw loginError;
      }

      const { error: cloudError } = await window.halaSupabase
        .from('sales_records')
        .insert({
          data: {
            id,
            fileName: file.name,
            uploadDate: Date.now(),
            dataType: 'snapshot',
            records: report.rows.length,
            branches: model.totals.branches,
            products: model.totals.items,
            totalSales: model.totals.sales,
            totalProfit: model.totals.profit,
            valid: true,
            rows: report.rows
          }
        });

      if (cloudError) throw cloudError;
       await DB.put({
        id,
        fileName: file.name,
        uploadDate: Date.now(),
        dataType: 'snapshot',
        records: report.rows.length,
        branches: model.totals.branches,
        products: model.totals.items,
        totalSales: model.totals.sales,
        totalProfit: model.totals.profit,
        valid: true,
        rows: report.rows
      });
        }catch(err){
      throw err;
    }

    setStep(4,'done'); setProgress(100);
    updateFileInfo();
    renderUploadReport(S.uploadMeta);
    toast(t('upDone'), 'ok');
    setTimeout(() => navigate('dashboard'), 600);

  }catch(err){
    console.error(err);
    toast((S.lang==='ar'?'فشل قراءة الملف: ':'Failed to read file: ') + err.message, 'err');
    if (stepsBox) stepsBox.innerHTML = '<div class="alert err">' + esc(err.message) + '</div>';
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

   ================================================================ */
function downloadXLSX(sheets, filename){
  const wb = XLSX.utils.book_new();
  Object.keys(sheets).forEach(name => {
    const ws = XLSX.utils.aoa_to_sheet(sheets[name]);
    XLSX.utils.book_append_sheet(wb, ws, name.substring(0, 31));
  });
  XLSX.writeFile(wb, filename);
}
function downloadCSV(aoa, filename){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const csv = XLSX.utils.sheet_to_csv(ws);
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadPDF(title, header, rows, filename){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
    doc.setFontSize(14);
    doc.text(String(title), 30, 30);
    doc.setFontSize(8);
    doc.text(new Date().toLocaleString(), 30, 44);
    doc.autoTable({
      head: [header],
      body: rows,
      startY: 56,
      styles:{fontSize:7, cellPadding:4},
      headStyles:{fillColor:[30,45,80], textColor:255, fontStyle:'bold'},
      alternateRowStyles:{fillColor:[242,246,252]},
      margin:{left:30, right:30}
    });
    doc.save(filename);
    toast('PDF exported.', 'ok');
  }catch(e){
    console.error(e);
    toast('PDF export failed: ' + e.message, 'err');
  }
}
function pdfSafe(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/[\u0600-\u06FF\u0750-\u077F]/g, ''); // strip Arabic glyphs (no embedded font)
}

/* Generic report builders -------------------------------------- */
function reportBranchComparison(){
  const B = S.model.branchStats;
  const header = ['Branch','Sales','Qty','Cost','Profit','Margin %','Stock','Sold','Out','Low','Over','Fast','Contrib %','Rank'];
  const rows = B.map(b => [b.code, +b.sales.toFixed(2), +b.qty.toFixed(0), +b.cost.toFixed(2), +b.profit.toFixed(2),
    +b.margin.toFixed(2), +b.stock.toFixed(0), b.sold, b.out, b.low, b.over, b.fast, +b.contribution.toFixed(2), b.rank]);
  return {header, rows, title:'All Branches Comparison'};
}
function reportStock(kind){
  const M = S.model;
  let recs = M.records.filter(r => r.stockStatus === kind);
  const f = S.quickFilter[kind] || 'all';
  if (f !== 'all') recs = recs.filter(r => r.branchCode === f);
  const header = ['Branch','Item Code','Item Name','Subgroup','Sales Qty','Sales','Cost','Profit','Margin %','Stock','Est. Daily','Coverage Days','Priority'];
  const rows = recs.map(r => [r.branchCode, r.itemCode, pdfSafe(r.itemName), pdfSafe(r.subName),
    +r.qty.toFixed(2), +r.sales.toFixed(2), +r.cost.toFixed(2), +r.profit.toFixed(2),
    +r.margin.toFixed(2), +r.stock.toFixed(2), +r.avgDaily.toFixed(2),
    isFinite(r.coverage) ? +r.coverage.toFixed(1) : 'inf', outPriority(r).toUpperCase()]);
  return {header, rows, title: kind === 'out' ? 'Out of Stock Report' : kind === 'low' ? 'Low Stock Report' : 'Overstock Report'};
}
function reportTransfers(){
  const header = ['Item Code','Item Name','Source','Destination','Source Stock','Dest Stock','Dest Velocity','Transfer Qty','Priority','Status','Reason'];
  const rows = S.transfers.map(r => [r.itemCode, pdfSafe(r.itemName), r.source, r.dest,
    +r.srcStock.toFixed(0), +r.dstStock.toFixed(0), +r.dstVelocity.toFixed(2), r.qty,
    r.priority.toUpperCase(), r.status, pdfSafe(r.reason)]);
  return {header, rows, title:'Stock Transfer Recommendations'};
}

/* ================================================================
   16. TOAST & MODAL
   ================================================================ */
function toast(msg, type){
  const box = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(30px)'; }, 3200);
  setTimeout(() => el.remove(), 3700);
}
function confirmModal(title, msg, onYes){
  const m = $('#modal'), box = $('#modalBox');
  box.innerHTML = '<h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p>' +
    '<div class="modal-actions">' +
      '<button class="btn" data-modal="no">' + t('cancel') + '</button>' +
      '<button class="btn red" data-modal="yes">' + t('confirm') + '</button>' +
    '</div>';
  m.classList.add('on');
  const close = () => { m.classList.remove('on'); box.innerHTML = ''; };
  box.querySelector('[data-modal="no"]').onclick = close;
  box.querySelector('[data-modal="yes"]').onclick = () => { close(); onYes(); };
}

/* ================================================================
   17. GLOBAL EVENT DELEGATION
   ================================================================ */
document.addEventListener('click', async e => {
  // sidebar nav
  const navEl = e.target.closest('[data-nav]');
  if (navEl){ navigate(navEl.dataset.nav); return; }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const fmt = btn.dataset.fmt || 'xlsx';

  switch(act){

    case 'toggleSidebar': $('#sidebar').classList.toggle('open'); break;

    case 'toggleLang':
      S.lang = S.lang === 'en' ? 'ar' : 'en';
      savePrefs(); applyDirection(); buildNav(); updateFileInfo(); navigate(S.currentPage);
      break;

    case 'toggleTheme':
      S.theme = S.theme === 'dark' ? 'light' : 'dark';
      savePrefs(); applyTheme(); navigate(S.currentPage);
      break;

    case 'setLang':
      S.lang = btn.dataset.lang; savePrefs(); applyDirection(); buildNav(); navigate('settings');
      break;

    case 'setTheme':
      S.theme = btn.dataset.theme; savePrefs(); applyTheme(); navigate('settings');
      break;

    case 'pickFile': $('#fileInput').click(); break;

    case 'saveSettings':
      applySettingsFromDOM();
      savePrefs();
      if (S.rows){
        S.model = buildModel(S.rows, S.settings);
        S.transfers = [];
        if (!S.model.branchStats.find(b => b.code === S.selBranch))
          S.selBranch = S.model.branchStats.length ? S.model.branchStats[0].code : null;
      }
      toast(t('setSaved'), 'ok');
      navigate(S.currentPage);
      break;

    case 'resetSettings':
      S.settings = Object.assign({}, DEFAULT_SETTINGS, {abc: Object.assign({}, DEFAULT_SETTINGS.abc)});
      savePrefs();
      if (S.rows) S.model = buildModel(S.rows, S.settings);
      toast(t('setSaved'), 'ok');
      navigate('settings');
      break;

    case 'branchSort': {
      const key = btn.dataset.sort;
      const B = S.model.branchStats;
      if (key === 'margin') B.sort((a,b) => a.margin - b.margin);
      else if (key === 'code') B.sort((a,b) => String(a.code).localeCompare(String(b.code)));
      else B.sort((a,b) => b[key] - a[key]);
      B.forEach((b,i) => b.rank = i+1);
      RENDER.branches(document.getElementById('page-branches'));
      break;
    }

    case 'genTransfers':
      S.transfers = generateTransfers();
      toast(S.transfers.length
        ? (S.lang==='ar' ? 'تم إنشاء ' + S.transfers.length + ' توصية تحويل.' : S.transfers.length + ' transfer recommendations generated.')
        : t('trEmpty'), S.transfers.length ? 'ok' : 'warn');
      navigate('transfer');
      break;

    case 'approveTransfer': {
      const rec = S.transfers.find(x => x.id === btn.dataset.id);
      if (rec){ rec.status = 'approved'; RENDER.transfer(document.getElementById('page-transfer')); }
      break;
    }
    case 'rejectTransfer': {
      const rec = S.transfers.find(x => x.id === btn.dataset.id);
      if (rec){ rec.status = 'rejected'; RENDER.transfer(document.getElementById('page-transfer')); }
      break;
    }

    case 'restoreHistory': {
      const rec = await DB.get(btn.dataset.id);
      if (!rec || !rec.rows){ toast(t('hiNoRows'), 'warn'); break; }
      S.rows = rec.rows;
      S.model = buildModel(rec.rows, S.settings);
      S.transfers = [];
      S.uploadMeta = {
        fileName: rec.fileName, uploadDate: rec.uploadDate,
        records: rec.records, branches: rec.branches, products: rec.products,
        missing: [], warnings: [], valid: true, skipped: 0, duplicates: 0
      };
      S.selBranch = S.model.branchStats.length ? S.model.branchStats[0].code : null;
      S.selItem = null;
      updateFileInfo();
      toast(t('upDone'), 'ok');
      navigate('dashboard');
      break;
    }

    case 'deleteHistory': {
      const id = btn.dataset.id;
      confirmModal(t('btnDelete'), t('hiConfirmDelete'), async () => {
        try{ await DB.del(id); }catch(e){}
        navigate('history');
        toast('Deleted.', 'ok');
      });
      break;
    }

    case 'printPage': window.print(); break;

    /* ---- Exports ---- */
    case 'exportBranchComparison':
      if (!S.model) return;
      { const r = reportBranchComparison();
        if (fmt === 'xlsx') downloadXLSX({['Branches']:[r.header].concat(r.rows)}, 'branches_comparison.xlsx');
        else if (fmt === 'csv') downloadCSV([r.header].concat(r.rows), 'branches_comparison.csv');
        else downloadPDF(r.title, r.header, r.rows, 'branches_comparison.pdf'); }
      break;

    case 'pdfBranchComparison':
      if (!S.model) return;
      { const r = reportBranchComparison(); downloadPDF(r.title, r.header, r.rows, 'branches_comparison.pdf'); }
      break;

    case 'exportBranchReport':
    case 'pdfBranchReport': {
      if (!S.model) return;
      const recs = S.model.records.filter(r => r.branchCode === S.selBranch).sort((a,b) => b.sales - a.sales);
      const header = ['Item Code','Item Name','Subgroup','Unit','Sales Qty','Sales','Cost','Profit','Margin %','Stock','Status'];
      const rows = recs.map(r => [r.itemCode, pdfSafe(r.itemName), pdfSafe(r.subName), pdfSafe(r.unit),
        +r.qty.toFixed(2), +r.sales.toFixed(2), +r.cost.toFixed(2), +r.profit.toFixed(2),
        +r.margin.toFixed(2), +r.stock.toFixed(2), r.stockStatus]);
      if (act === 'exportBranchReport' && fmt === 'csv') downloadCSV([header].concat(rows), 'branch_' + S.selBranch + '.csv');
      else if (act === 'exportBranchReport' && fmt !== 'pdf') downloadXLSX({['Branch ' + S.selBranch]:[header].concat(rows)}, 'branch_' + S.selBranch + '.xlsx');
      else downloadPDF('Branch Report — ' + S.selBranch, header, rows, 'branch_' + S.selBranch + '.pdf');
      break;
    }

    case 'exportStock':
    case 'pdfStock': {
      if (!S.model) return;
      const r = reportStock(btn.dataset.kind);
      const name = btn.dataset.kind + '_report';
      if (act === 'exportStock' && fmt === 'csv') downloadCSV([r.header].concat(r.rows), name + '.csv');
      else if (act === 'exportStock' && fmt !== 'pdf') downloadXLSX({[btn.dataset.kind]:[r.header].concat(r.rows)}, name + '.xlsx');
      else downloadPDF(r.title, r.header, r.rows, name + '.pdf');
      break;
    }

    case 'exportOOSAll': { if (!S.model) return; const r = reportStock('out');
      if (fmt==='xlsx') downloadXLSX({'OutOfStock':[r.header].concat(r.rows)}, 'out_of_stock.xlsx');
      else if (fmt==='csv') downloadCSV([r.header].concat(r.rows), 'out_of_stock.csv');
      else downloadPDF(r.title, r.header, r.rows, 'out_of_stock.pdf'); break; }

    case 'exportLowAll': { if (!S.model) return; const r = reportStock('low');
      if (fmt==='xlsx') downloadXLSX({'LowStock':[r.header].concat(r.rows)}, 'low_stock.xlsx');
      else if (fmt==='csv') downloadCSV([r.header].concat(r.rows), 'low_stock.csv');
      else downloadPDF(r.title, r.header, r.rows, 'low_stock.pdf'); break; }

    case 'exportOverAll': { if (!S.model) return; const r = reportStock('over');
      if (fmt==='xlsx') downloadXLSX({'Overstock':[r.header].concat(r.rows)}, 'overstock.xlsx');
      else if (fmt==='csv') downloadCSV([r.header].concat(r.rows), 'overstock.csv');
      else downloadPDF(r.title, r.header, r.rows, 'overstock.pdf'); break; }

    case 'exportFast':
    case 'pdfFast': {
      if (!S.model) return;
      const recs = S.model.records.filter(r => r.branchCode === S.selBranch && r.qty > 0)
        .sort((a,b) => b.qty - a.qty).slice(0, S.settings.topN);
      const header = ['Rank','Branch','Item Code','Item Name','Sales Qty','Sales','Profit','Margin %','Stock','Status','Movement'];
      const rows = recs.map((r,i) => [i+1, r.branchCode, r.itemCode, pdfSafe(r.itemName),
        +r.qty.toFixed(2), +r.sales.toFixed(2), +r.profit.toFixed(2), +r.margin.toFixed(2),
        +r.stock.toFixed(2), r.stockStatus, r.movement]);
      if (act === 'exportFast' && fmt === 'csv') downloadCSV([header].concat(rows), 'fast_moving.csv');
      else if (act === 'exportFast' && fmt !== 'pdf') downloadXLSX({['Fast ' + S.selBranch]:[header].concat(rows)}, 'fast_moving.xlsx');
      else downloadPDF('Fast-Moving Items — ' + S.selBranch, header, rows, 'fast_moving.pdf');
      break;
    }

    case 'exportItemComparison':
    case 'pdfItemComparison': {
      if (!S.model || !S.selItem) return;
      const it = S.model.itemMap.get(S.selItem);
      const header = ['Branch','Sales Qty','Sales','Cost','Profit','Margin %','Stock','Status','Movement'];
      const rows = it.branches.map(r => [r.branchCode, +r.qty.toFixed(2), +r.sales.toFixed(2), +r.cost.toFixed(2),
        +r.profit.toFixed(2), +r.margin.toFixed(2), +r.stock.toFixed(2), r.stockStatus, r.movement]);
      if (act === 'exportItemComparison' && fmt === 'csv') downloadCSV([header].concat(rows), 'item_' + S.selItem + '.csv');
      else if (act === 'exportItemComparison' && fmt !== 'pdf') downloadXLSX({['Item ' + S.selItem]:[header].concat(rows)}, 'item_' + S.selItem + '.xlsx');
      else downloadPDF('Item Comparison — ' + S.selItem, header, rows, 'item_' + S.selItem + '.pdf');
      break;
    }

    case 'exportTransfers':
    case 'pdfTransfers': {
      if (!S.transfers.length){ toast(t('trEmpty'), 'warn'); return; }
      const r = reportTransfers();
      if (act === 'exportTransfers' && fmt === 'csv') downloadCSV([r.header].concat(r.rows), 'transfers.csv');
      else if (act === 'exportTransfers' && fmt !== 'pdf') downloadXLSX({Transfers:[r.header].concat(r.rows)}, 'transfers.xlsx');
      else downloadPDF(r.title, r.header, r.rows, 'transfers.pdf');
      break;
    }

    case 'exportMgmt': {
      if (!S.model) return;
      const T = S.model.totals;
      const header = ['Metric','Value'];
      const rows = [
        ['Total Sales', T.sales.toFixed(2)],
        ['Total Sales Quantity', T.qty.toFixed(2)],
        ['Total Cost', T.cost.toFixed(2)],
        ['Total Profit', T.profit.toFixed(2)],
        ['Profit Margin %', T.margin.toFixed(2)],
        ['Available Stock', T.stock.toFixed(2)],
        ['Items', T.items], ['Branches', T.branches],
        ['Out of Stock Items', T.out], ['Low Stock Items', T.low],
        ['Overstock Items', T.over], ['Fast-Moving Items', T.fast]
      ];
      if (fmt === 'pdf') downloadPDF('Management Summary', header, rows, 'management_summary.pdf');
      else if (fmt === 'csv') downloadCSV([header].concat(rows), 'management_summary.csv');
      else {
        const bc = reportBranchComparison();
        downloadXLSX({Summary:[header].concat(rows), Branches:[bc.header].concat(bc.rows)}, 'management_summary.xlsx');
      }
      break;
    }

    case 'exportUploadSummary': {
      if (!S.uploadMeta){ toast(t('noData'), 'warn'); return; }
      const m = S.uploadMeta;
      const header = ['Field','Value'];
      const rows = [
        ['File Name', m.fileName],
        ['Upload Date', new Date(m.uploadDate).toISOString()],
        ['Records', m.records], ['Branches', m.branches], ['Products', m.products],
        ['Validation', m.missing && m.missing.length ? 'FAILED' : 'PASSED'],
        ['Skipped Rows', m.skipped || 0], ['Merged Duplicates', m.duplicates || 0]
      ];
      if (fmt === 'pdf') downloadPDF('Daily Upload Summary', header, rows, 'upload_summary.pdf');
      else if (fmt === 'csv') downloadCSV([header].concat(rows), 'upload_summary.csv');
      else downloadXLSX({Upload:[header].concat(rows)}, 'upload_summary.xlsx');
      break;
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.set){
    const key = el.dataset.set;
    const val = el.type === 'number' ? parseFloat(el.value) : el.value;
    if (key.startsWith('abc.')){
      S.settings.abc[key.split('.')[1]] = val;
    } else {
      S.settings[key] = val;
    }
  }
});

$('#fileInput').addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
  e.target.value = '';
});

function applySettingsFromDOM(){
  $$('[data-set]').forEach(el => {
    const key = el.dataset.set;
    const val = el.type === 'number' ? parseFloat(el.value) : el.value;
    if (key.startsWith('abc.')){
      const k = key.split('.')[1];
      if (isFinite(val)) S.settings.abc[k] = val;
    } else if (el.type === 'number'){
      if (isFinite(val) && val >= 0) S.settings[key] = val;
    } else {
      S.settings[key] = val;
    }
  });
  // sanity: ABC cumulative must be increasing
  const a = S.settings.abc;
  if (a.B < a.A) a.B = a.A;
  if (a.C < a.B) a.C = a.B;
  if (a.D < a.C) a.D = a.C;
  if (a.D > 1) a.D = 1;
}

/* ================================================================
   18. BOOTSTRAP
   ================================================================ */
(function init(){
  loadPrefs();
  applyDirection();
  applyTheme();
  buildNav();
  updateFileInfo();

  // Chart.js global defaults
  if (typeof Chart !== 'undefined'){
    Chart.defaults.font.family = '"Segoe UI","Tahoma",sans-serif';
    Chart.defaults.font.size = 11;
  }

  navigate('dashboard');

    // Load latest dashboard data from Supabase
  window.halaSupabase
    .from('sales_records')
    .select('data')
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle()
    .then(({ data, error }) => {
      if (error) throw error;

      const last = data && data.data;
      if (!last || !last.rows || !last.rows.length) return;

      S.rows = last.rows;
      S.model = buildModel(last.rows, S.settings);
      S.uploadMeta = {
        fileName: last.fileName,
        uploadDate: last.uploadDate,
        records: last.records,
        branches: last.branches,
        products: last.products,
        missing: [],
        warnings: [],
        valid: true,
        skipped: 0,
        duplicates: 0
      };

      S.selBranch = S.model.branchStats.length
        ? S.model.branchStats[0].code : null;

      updateFileInfo();
      if (S.currentPage === 'dashboard') navigate('dashboard');
    })
    .catch(err => console.error('Supabase load failed:', err));

  window.addEventListener('resize', () => {
    if (window.innerWidth > 980) $('#sidebar').classList.remove('open');
  });
})();
</script>
